name: Validar RECON

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar sintaxe JavaScript
        run: |
          set -e
          for file in *.js; do
            echo "Verificando $file"
            node --check "$file"
          done

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar IDs estáticos e referências
        run: python .github/scripts/validate_static.py
