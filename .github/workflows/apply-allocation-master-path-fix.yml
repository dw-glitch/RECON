name: Apply allocation master path fix

on:
  push:
    branches:
      - fix/allocation-master-path-hierarchy
    paths:
      - '.github/workflows/apply-allocation-master-path-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/allocation-master-path-hierarchy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply structural hierarchy fix
        run: node scripts/apply_allocation_master_path_fix.mjs
      - name: Check JavaScript syntax
        run: |
          node --check allocation_core.js
          node --check ALLOCATION_HIERARCHY_TESTS.mjs
      - name: Static validation
        run: python3 validate_static.py
      - name: Existing regression suite
        run: node RECON_TESTES.mjs
      - name: Allocation hierarchy regression suite
        run: node ALLOCATION_HIERARCHY_TESTS.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add allocation_core.js ALLOCATION_HIERARCHY_TESTS.mjs
          if ! git diff --cached --quiet; then
            git commit -m "fix(allocation): prioritize master hierarchy paths"
            git push
          fi
# retry: repaired patch syntax
