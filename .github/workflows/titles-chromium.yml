name: Title correction Chromium
on: [push, pull_request]
jobs:
  titles-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate title correction in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/titles-server.log" 2>&1 &
          QA_SERVER_PID=$!
          trap 'kill "$QA_SERVER_PID"' EXIT
          node scripts/validar-titles-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: title-correction-chromium
          path: artifacts/titles/
          if-no-files-found: warn
